server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        name: INFRAPILOT_SESSION
        http-only: true
        same-site: strict
        secure: ${INFRAPILOT_SESSION_COOKIE_SECURE:false}
spring:
  application:
    name: infrapilot
  datasource:
    url: ${INFRAPILOT_DATABASE_URL:jdbc:h2:file:./data/infrapilot}
    username: ${INFRAPILOT_DATABASE_USERNAME:infrapilot}
    password: ${INFRAPILOT_DATABASE_PASSWORD:}
  sql:
    init:
      mode: always
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true
infrapilot:
  mode: ${INFRAPILOT_MODE:demo}
  admin-username: ${INFRAPILOT_ADMIN_USERNAME:admin}
  admin-password: ${INFRAPILOT_ADMIN_PASSWORD:}
  viewer-username: ${INFRAPILOT_VIEWER_USERNAME:viewer}
  viewer-password: ${INFRAPILOT_VIEWER_PASSWORD:}
  timeout-seconds: 5

  bind:
    enabled: ${INFRAPILOT_BIND_ENABLED:false}
    private-key-file: ${INFRAPILOT_BIND_PRIVATE_KEY_FILE:}
    known-hosts-file: ${INFRAPILOT_BIND_KNOWN_HOSTS_FILE:}
    backup-directory: ${INFRAPILOT_BIND_BACKUP_DIRECTORY:./data/bind}

  forwarding:
    enabled: ${INFRAPILOT_FORWARDING_ENABLED:false}
    private-key-file: ${INFRAPILOT_FORWARDING_PRIVATE_KEY_FILE:}
    known-hosts-file: ${INFRAPILOT_FORWARDING_KNOWN_HOSTS_FILE:}
    backup-directory: ${INFRAPILOT_FORWARDING_BACKUP_DIRECTORY:./data/conditional-forwarding}

  gateway:
    enabled: ${INFRAPILOT_GATEWAY_ENABLED:false}
    url: ${INFRAPILOT_GATEWAY_URL:}
    api-key: ${INFRAPILOT_GATEWAY_API_KEY:}
    backup-directory: ${INFRAPILOT_GATEWAY_BACKUP_DIRECTORY:./data/application-gateway}
    runtime-config-file: ${INFRAPILOT_GATEWAY_RUNTIME_CONFIG_FILE:}

  dhcp:
    enabled: ${INFRAPILOT_DHCP_ENABLED:false}
    nodes:
      - id: kea1
        label: DHCP 主节点
        url: ${INFRAPILOT_KEA1_API_URL:}
        username: ${INFRAPILOT_KEA1_API_USERNAME:}
        password: ${INFRAPILOT_KEA1_API_PASSWORD:}
      - id: kea2
        label: DHCP 备节点
        url: ${INFRAPILOT_KEA2_API_URL:}
        username: ${INFRAPILOT_KEA2_API_USERNAME:}
        password: ${INFRAPILOT_KEA2_API_PASSWORD:}
