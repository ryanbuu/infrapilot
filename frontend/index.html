<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f3faf6" />
    <script>
      // Match the saved appearance before CSS and the application load.
      (() => {
        let mode = "system";
        try {
          mode = localStorage.getItem("infrapilot.theme") || "system";
        } catch {}
        const dark =
          mode === "dark" ||
          (mode !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", dark ? "#101d18" : "#f3faf6");
      })();
    </script>
    <title>InfraPilot · DNS 与 DHCP 管理</title>
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32.png?v=green1"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=green1" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png?v=green1"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
