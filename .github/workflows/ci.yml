name: Verify
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B -f backend/pom.xml verify
      - run: python3 -m unittest discover -s deploy/forwarding -p 'test_*.py' -v
      - run: python3 -m unittest discover -s deploy/bind -p 'test_*.py' -v
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          {
            node-version: "22",
            cache: npm,
            cache-dependency-path: frontend-extjs/package-lock.json,
          }
      - run: npm ci
        working-directory: frontend-extjs
      - run: npm run sdk
        working-directory: frontend-extjs
      - run: npm test
        working-directory: frontend-extjs
      - run: npm run build
        working-directory: frontend-extjs
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: "22",
            cache: npm,
            cache-dependency-path: frontend-extjs/package-lock.json,
          }
      - run: mvn -B -f backend/pom.xml package -DskipTests
      - run: npm ci && npm run sdk && npx playwright install --with-deps chromium
        working-directory: frontend-extjs
      - name: Run browser checks against isolated demo
        working-directory: frontend-extjs
        run: |
          npm run demo > demo.log 2>&1 &
          demo_pid=$!
          trap 'kill "$demo_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5181/api/meta > /dev/null; then
              break
            fi
            sleep 1
          done
          npm run test:e2e
          npm run test:forms
          npm run test:ups
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces
          path: |
            frontend-extjs/test-results
            frontend-extjs/demo.log
