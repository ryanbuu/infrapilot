name: Verify
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B -f backend/pom.xml verify
      - run: python3 -m unittest discover -s deploy/forwarding -p 'test_*.py' -v
      - run: python3 -m unittest discover -s deploy/bind -p 'test_*.py' -v
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          {
            node-version: "22",
            cache: npm,
            cache-dependency-path: frontend/package-lock.json,
          }
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: "22",
            cache: npm,
            cache-dependency-path: frontend/package-lock.json,
          }
      - run: npm ci && npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: browser-traces, path: frontend/test-results }
