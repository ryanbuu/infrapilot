name: infrapilot
services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      INFRAPILOT_BIND_ENABLED: ${INFRAPILOT_BIND_ENABLED:-false}
      INFRAPILOT_BIND_PRIVATE_KEY_FILE: ${INFRAPILOT_BIND_PRIVATE_KEY_FILE:-}
      INFRAPILOT_BIND_KNOWN_HOSTS_FILE: ${INFRAPILOT_BIND_KNOWN_HOSTS_FILE:-}
      INFRAPILOT_BIND_BACKUP_DIRECTORY: ${INFRAPILOT_BIND_BACKUP_DIRECTORY:-/app/data/bind}
      INFRAPILOT_FORWARDING_ENABLED: ${INFRAPILOT_FORWARDING_ENABLED:-false}
      INFRAPILOT_FORWARDING_PRIVATE_KEY_FILE: ${INFRAPILOT_FORWARDING_PRIVATE_KEY_FILE:-}
      INFRAPILOT_FORWARDING_KNOWN_HOSTS_FILE: ${INFRAPILOT_FORWARDING_KNOWN_HOSTS_FILE:-}
      INFRAPILOT_FORWARDING_BACKUP_DIRECTORY: ${INFRAPILOT_FORWARDING_BACKUP_DIRECTORY:-/app/data/conditional-forwarding}
      INFRAPILOT_GATEWAY_ENABLED: ${INFRAPILOT_GATEWAY_ENABLED:-false}
      INFRAPILOT_GATEWAY_URL: ${INFRAPILOT_GATEWAY_URL:-}
      INFRAPILOT_GATEWAY_API_KEY: ${INFRAPILOT_GATEWAY_API_KEY:-}
      INFRAPILOT_GATEWAY_BACKUP_DIRECTORY: ${INFRAPILOT_GATEWAY_BACKUP_DIRECTORY:-/app/data/application-gateway}
      INFRAPILOT_GATEWAY_RUNTIME_CONFIG_FILE: ${INFRAPILOT_GATEWAY_RUNTIME_CONFIG_FILE:-}
      INFRAPILOT_DHCP_ENABLED: ${INFRAPILOT_DHCP_ENABLED:-false}
      INFRAPILOT_KEA1_API_URL: ${INFRAPILOT_KEA1_API_URL:-}
      INFRAPILOT_KEA1_API_USERNAME: ${INFRAPILOT_KEA1_API_USERNAME:-}
      INFRAPILOT_KEA1_API_PASSWORD: ${INFRAPILOT_KEA1_API_PASSWORD:-}
      INFRAPILOT_KEA2_API_URL: ${INFRAPILOT_KEA2_API_URL:-}
      INFRAPILOT_KEA2_API_USERNAME: ${INFRAPILOT_KEA2_API_USERNAME:-}
      INFRAPILOT_KEA2_API_PASSWORD: ${INFRAPILOT_KEA2_API_PASSWORD:-}
      INFRAPILOT_DATABASE_URL: ${INFRAPILOT_DATABASE_URL:-jdbc:h2:file:./data/infrapilot}
      INFRAPILOT_DATABASE_USERNAME: ${INFRAPILOT_DATABASE_USERNAME:-infrapilot}
      INFRAPILOT_DATABASE_PASSWORD: ${INFRAPILOT_DATABASE_PASSWORD:-}
      INFRAPILOT_MODE: ${INFRAPILOT_MODE:-demo}
      INFRAPILOT_ADMIN_USERNAME: ${INFRAPILOT_ADMIN_USERNAME:-admin}
      INFRAPILOT_ADMIN_PASSWORD: ${INFRAPILOT_ADMIN_PASSWORD:-}
      INFRAPILOT_VIEWER_USERNAME: ${INFRAPILOT_VIEWER_USERNAME:-viewer}
      INFRAPILOT_VIEWER_PASSWORD: ${INFRAPILOT_VIEWER_PASSWORD:-}
      INFRAPILOT_SESSION_COOKIE_SECURE: ${INFRAPILOT_SESSION_COOKIE_SECURE:-false}
      SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/app/config/
      INFRAPILOT_TSIG_SECRET: ${INFRAPILOT_TSIG_SECRET:-}
    volumes:
      - audit-data:/app/data
      - ./deploy/config:/app/config:ro
    expose: ["8080"]
    security_opt: ["no-new-privileges:true"]
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "${INFRAPILOT_LISTEN_ADDRESS:-127.0.0.1}:${INFRAPILOT_HTTP_PORT:-8088}:8080"
    security_opt: ["no-new-privileges:true"]
volumes:
  audit-data:
